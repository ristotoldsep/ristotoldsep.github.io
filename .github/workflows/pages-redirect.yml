name: GitHub Pages redirect

# ristotoldsep.github.io only forwards visitors to ristotoldsep.eu.
# The real site is built and hosted by Netlify.

on:
  push:
    branches: [master]
    paths:
      - .github/pages-redirect/**
      - .github/workflows/pages-redirect.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - run: |
          mkdir _site
          cp .github/pages-redirect/redirect.html _site/index.html
          cp .github/pages-redirect/redirect.html _site/404.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
