[build]
  command   = "npm run build"
  publish   = "dist"

[build.environment]
  NODE_VERSION = "20"

# Let the edge serve the HTML instead of revalidating it every time.
#
# Without this, Netlify's CDN answered `fwd=miss` on every single request for
# the documents and went back to origin: GTmetrix measured 410ms of "backend"
# on a page that is a static file sitting on a CDN. Netlify-CDN-Cache-Control
# speaks only to their edge; the Cache-Control browsers see is unchanged.
#
# Safe because every page here is statically generated at build time with no
# server rendering and no request-time data, and Netlify purges this cache on
# each deploy - so the only way to serve a stale page is to stop deploying.
[[headers]]
  for = "/*"
  [headers.values]
    Netlify-CDN-Cache-Control = "public, durable, max-age=31536000, stale-while-revalidate=86400"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Astro content-hashes everything under /_astro, so the filename changes
# whenever the bytes do. Without this rule these came back
# "max-age=0, must-revalidate" and every navigation paid a round trip to be
# told the file had not changed.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Syne, self-hosted. Not content-hashed, but it is a pinned version of a
# typeface - if it is ever replaced, it will be under a new filename.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# @astrojs/sitemap emits /sitemap-index.xml. The old hand-written
# /sitemap.xml is already submitted to Search Console, so keep it resolving.
[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap-index.xml"
  status = 301
